<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Event Pass</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #35127a,
                #7b22c9,
                #d23ee8
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            color: white;
        }

        .pass {
            width: 500px;
            max-width: 95%;

            background: rgba(255,255,255,0.18);

            border: 1px solid
                    rgba(255,255,255,0.35);

            border-radius: 25px;

            padding: 35px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 45px
                rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;

            padding-bottom: 25px;

            border-bottom: 1px dashed
                        rgba(255,255,255,0.5);
        }

        .icon {
            font-size: 55px;

            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;

            opacity: 0.9;
        }

        .details {
            margin-top: 25px;
        }

        .row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 13px 0;

            border-bottom: 1px solid
                        rgba(255,255,255,0.15);
        }

        .label {
            font-weight: bold;
        }

        .value {
            text-align: right;
        }

        .status {
            color: #d8ffd8;

            font-weight: bold;
        }

        .pass-id {
            text-align: center;

            margin-top: 25px;

            font-size: 18px;

            font-weight: bold;
        }

        .home-btn {
            display: block;

            width: fit-content;

            margin: 25px auto 0;

            padding: 12px 28px;

            background: white;

            color: #6a1bb1;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;
        }

        .home-btn:hover {
            background: #f0d9ff;
        }

    </style>

</head>


<body>

    <div class="pass">

        <div class="header">

            <div class="icon">
                🎫
            </div>

            <h1>
                Digital Event Pass
            </h1>

            <p>
                Campus Event Management System
            </p>

        </div>


        <div class="details">

            <div class="row">

                <span class="label">
                    Student Name
                </span>

                <span class="value">
                    Student
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Email
                </span>

                <span class="value">
                    student@example.com
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Event
                </span>

                <span class="value">
                    Campus Event
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Date
                </span>

                <span class="value">
                    Event Date
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Time
                </span>

                <span class="value">
                    Event Time
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Venue
                </span>

                <span class="value">
                    Event Venue
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Status
                </span>

                <span class="value status">
                    REGISTERED
                </span>

            </div>

        </div>


        <div class="pass-id">

            🎟️ Pass ID: CEP-0001

        </div>


        <a href="index.html"
           class="home-btn">

            BACK TO HOME

        </a>

    </div>

</body>

</html>
