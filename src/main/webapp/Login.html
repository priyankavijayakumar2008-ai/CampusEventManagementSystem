<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #35127a, #7b22c9, #d23ee8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 950px;
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 45px;
            border-radius: 22px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
        }

        .login-box {
            width: 380px;
            text-align: center;
        }

        .user-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .login-box h2 {
            color: white;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 45px;
            margin-bottom: 15px;
            padding: 0 18px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.12);
            color: white;
            outline: none;
        }

        input::placeholder {
            color: #eee;
        }

        button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #7020a8;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0d5ff;
        }

        .register {
            display: block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .welcome {
            width: 40%;
            color: white;
        }

        .welcome h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .welcome h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #eee;
            line-height: 1.7;
        }

        @media (max-width: 750px) {
            .container {
                flex-direction: column;
                gap: 40px;
                padding: 30px 20px;
            }

            .login-box,
            .welcome {
                width: 100%;
                max-width: 380px;
            }

            .welcome {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="user-icon">
                &#128100;
            </div>

            <h2>Student Login</h2>

            <form action="LoginServlet" method="post">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <a href="Registration.html" class="register">
                Don't have an account? Register
            </a>

            <a href="index.html" class="register">
                Back to Home
            </a>

        </div>

        <div class="welcome">

            <h1>Welcome.</h1>

            <h3>Campus Event Management</h3>

            <p>
                Login to manage your campus events,
                registrations and student activities
                through our event management system.
            </p>

        </div>

    </div>

</body>
</html>
