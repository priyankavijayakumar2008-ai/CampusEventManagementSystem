<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #35127a, #7b22c9, #d23ee8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            min-height: 600px;
            display: flex;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(15px);
            overflow: hidden;
        }

        /* LEFT SECTION */

        .welcome-section {
            width: 45%;
            padding: 70px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }

        .welcome-section h1 {
            font-size: 55px;
            margin-bottom: 18px;
        }

        .welcome-section h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .welcome-section p {
            color: #eeeeee;
            font-size: 16px;
            line-height: 1.8;
        }

        /* RIGHT SECTION */

        .form-section {
            width: 55%;
            padding: 55px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .form-section h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .input-box {
            width: 100%;
            height: 52px;
            margin-bottom: 17px;
            padding: 0 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 15px;
            outline: none;
        }

        .input-box::placeholder {
            color: #eeeeee;
        }

        .register-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #7020a8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #f0d5ff;
        }

        .back-home {
            display: block;
            width: 100%;
            height: 52px;
            line-height: 52px;
            text-align: center;
            margin-top: 15px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.50);
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            color: #ffd8ff;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            body {
                padding: 20px 0;
            }

            .container {
                flex-direction: column;
                width: 94%;
            }

            .welcome-section,
            .form-section {
                width: 100%;
                padding: 40px;
            }

            .welcome-section {
                text-align: center;
            }

            .welcome-section h1 {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- WELCOME SECTION -->

        <div class="welcome-section">

            <h1>Welcome.</h1>

            <h2>Join Campus Events</h2>

            <p>
                Create your student account and participate
                in exciting campus events, workshops,
                hackathons and cultural activities.
            </p>

        </div>


        <!-- REGISTRATION FORM -->

        <div class="form-section">

            <h2>Student Registration</h2>

            <form action="RegisterServlet" method="post">

                <input
                    type="text"
                    name="name"
                    class="input-box"
                    placeholder="Full Name"
                    required>

                <input
                    type="email"
                    name="email"
                    class="input-box"
                    placeholder="Email"
                    required>

                <input
                    type="text"
                    name="department"
                    class="input-box"
                    placeholder="Department"
                    required>

                <input
                    type="password"
                    name="password"
                    class="input-box"
                    placeholder="Password"
                    required>

                <button
                    type="submit"
                    class="register-button">
                    REGISTER
                </button>

            </form>


            <!-- BACK TO HOME -->

            <a href="index.html" class="back-home">
                BACK TO HOME
            </a>


            <div class="login-link">
                Already have an account?
                <a href="Login.html">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
