<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #35127a, #7b22c9, #d23ee8);
        }

        .login-box {
            width: 420px;
            padding: 45px;
            text-align: center;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            color: white;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #6a1bb1;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0d9ff;
        }

        .home {
            display: inline-block;
            margin-top: 25px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="icon">👨‍💼</div>

        <h1>Staff Login</h1>

        <p class="subtitle">Campus Event Management System</p>

        <form action="StaffLoginServlet" method="post">

            <input type="text"
                   name="username"
                   placeholder="Staff Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                STAFF LOGIN
            </button>

        </form>

        <a href="index.html" class="home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
