<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Events</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #35127a,
                #7b22c9,
                #d23ee8
            );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .container {
            text-align: center;
            padding: 50px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .loader {
            width: 45px;
            height: 45px;

            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-btn {
            display: inline-block;

            margin-top: 30px;

            padding: 12px 28px;

            background: rgba(255,255,255,0.2);

            color: white;

            text-decoration: none;

            border: 1px solid rgba(255,255,255,0.4);

            border-radius: 25px;

            font-weight: bold;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            🎪
        </div>

        <h1>
            Campus Events
        </h1>

        <p>
            Loading all upcoming events...
        </p>

        <div class="loader"></div>

        <a href="index.html" class="back-btn">
            BACK TO HOME
        </a>

    </div>


    <script>

        // Open database-driven events page
        window.location.href = "ViewEventsServlet";

    </script>

</body>

</html>
