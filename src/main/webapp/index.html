<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Campus Event Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #35127a, #7b22c9, #d23ee8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-box {
            width: 94%;
            max-width: 1200px;
            min-height: 650px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.30);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(15px);
            overflow: hidden;
        }

        /* NAVBAR */

        .navbar {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 55px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd8ff;
        }

        .login-nav {
            background: white;
            color: #7020a8 !important;
            padding: 12px 28px;
            border-radius: 25px;
        }

        /* MAIN CONTENT */

        .content {
            min-height: 570px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 30px 70px;
        }

        /* REGISTRATION */

        .register-section {
            width: 430px;
            text-align: center;
        }

        .user-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;

            border: 3px solid rgba(255, 255, 255, 0.60);
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 55px;
        }

        .register-section h2 {
            color: white;
            font-size: 30px;
            margin-bottom: 22px;
        }

        .input-box {
            width: 100%;
            height: 50px;
            margin-bottom: 14px;

            padding: 0 25px;

            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.55);

            background: rgba(255, 255, 255, 0.12);

            color: white;
            font-size: 15px;
            outline: none;
        }

        .input-box::placeholder {
            color: #eeeeee;
        }

        .register-button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #7020a8;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        .register-button:hover {
            background: #f0d5ff;
        }

        .options {
            display: flex;
            justify-content: space-between;

            margin-top: 16px;

            color: white;
            font-size: 13px;
        }

        .options a {
            color: white;
            text-decoration: none;
        }

        /* WELCOME */

        .welcome {
            width: 470px;
            color: white;
        }

        .welcome h1 {
            font-size: 70px;
            margin-bottom: 18px;
        }

        .welcome h3 {
            font-size: 29px;
            margin-bottom: 20px;
        }

        .welcome p {
            color: #eeeeee;
            font-size: 16px;
            line-height: 1.8;
            max-width: 430px;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            body {
                overflow: auto;
                padding: 20px 0;
            }

            .main-box {
                width: 94%;
            }

            .navbar {
                padding: 0 25px;
            }

            .nav-links {
                display: none;
            }

            .content {
                flex-direction: column;
                gap: 50px;
                padding: 40px 25px;
            }

            .register-section,
            .welcome {
                width: 100%;
                max-width: 430px;
            }

            .welcome {
                text-align: center;
            }

            .welcome h1 {
                font-size: 50px;
            }

            .welcome p {
                margin: auto;
            }
        }
    </style>
</head>

<body>

    <div class="main-box">

        <!-- NAVBAR -->

        <div class="navbar">

            <div class="logo">
                CAMPUS EVENT
            </div>

            <div class="nav-links">

                <a href="index.html">
                    HOME
                </a>

                <a href="Login.html" class="login-nav">
                    LOGIN
                </a>

                <a href="event.html">
                    EVENTS
                </a>

                <a href="StaffLogin.html">
                    STAFF LOGIN
                </a>

            </div>

        </div>


        <!-- MAIN CONTENT -->

        <div class="content">

            <!-- REGISTRATION SECTION -->

            <div class="register-section">

                <div class="user-icon">
                    &#128100;
                </div>

                <h2>
                    Student Registration
                </h2>

                <form action="RegisterServlet" method="post">

                    <input
                        type="text"
                        name="name"
                        class="input-box"
                        placeholder="Name"
                        required>

                    <input
                        type="email"
                        name="email"
                        class="input-box"
                        placeholder="Email"
                        required>

                    <input
                        type="text"
                        name="department"
                        class="input-box"
                        placeholder="Department"
                        required>

                    <input
                        type="password"
                        name="password"
                        class="input-box"
                        placeholder="Password"
                        required>

                    <button
                        type="submit"
                        class="register-button">
                        REGISTER
                    </button>

                </form>

                <div class="options">

                    
                    <a href="Login.html">
                        Login
                    </a>

                </div>

            </div>


            <!-- WELCOME SECTION -->

            <div class="welcome">

                <h1>
                    Welcome.
                </h1>

                <h3>
                    Campus Event Management
                </h3>

                <p>
                    Register as a student to explore campus
                    events, participate in exciting activities
                    and stay connected with your college
                    community.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
